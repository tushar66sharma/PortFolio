<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/profile3.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tushar Sharma — Software Engineer. Backend systems, full-stack web apps and AI-powered tools." />
    <meta name="theme-color" content="#edf2f8" />
    <title>Tushar Sharma</title>
    <script>
      // Pick the theme before first paint: saved choice, else the OS setting.
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          theme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0a2a55" : "#edf2f8");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
